<!DOCTYPE html>
<html>
<head>
    <title>Simple Home Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #b4b0f8;
        }

        header {
            background-color: #cbdff1;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #cce6f6;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            color: rgb(210, 244, 198);
        }

        .content {
            text-align: center;
            padding: 50px;
        }

        h2 {
            color: #e5f6f9;
        }

        footer {
            background-color: #cadff527;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to Our Website</h1>
</header>

<nav>
    <a href="about.html">About Us</a>
    <a href="ourservice.html">Our Services</a>
    <a href="contact.html">Contact Us</a>
</nav>

<div class="content">
    <h2>Home Page</h2>
    <p>Welcome! Click the links above to learn more about us.</p>
</div>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
